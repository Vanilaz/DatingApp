<header
  class="fixed top-0 z-50 w-full bg-linear-to-r from-rose-500 via-pink-600 to-violet-600 shadow-lg backdrop-blur-md"
>
  <div class="navbar container mx-auto px-6 py-2">
    <!-- ฝั่งซ้าย: Brand Logo & Navigation -->
    <div class="flex items-center gap-8">
      <a
        href="#"
        class="group flex items-center gap-3 border-r border-white/25 pr-6 text-white transition-all hover:opacity-95"
      >
        <div
          class="flex size-10 items-center justify-center rounded-xl bg-white/15 shadow-inner backdrop-blur-xs transition-transform group-hover:scale-105"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-6 text-white"
          >
            <path
              d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
            />
          </svg>
        </div>
        <h3 class="text-2xl font-extrabold tracking-tight text-white">Dating App</h3>
      </a>

      <!-- Navigation Links -->
      <nav class="hidden items-center gap-1 md:flex">
        <a
          href="#"
          class="btn btn-ghost btn-sm rounded-lg text-sm font-semibold tracking-wider text-white/90 uppercase hover:bg-white/15 hover:text-white"
        >
          Matches
        </a>
        <a
          href="#"
          class="btn btn-ghost btn-sm rounded-lg text-sm font-semibold tracking-wider text-white/90 uppercase hover:bg-white/15 hover:text-white"
        >
          Lists
        </a>
        <a
          href="#"
          class="btn btn-ghost btn-sm rounded-lg text-sm font-semibold tracking-wider text-white/90 uppercase hover:bg-white/15 hover:text-white"
        >
          Messages
        </a>
      </nav>
    </div>

    <!-- ฝั่งขวา: User Profile Dropdown หรือ Login Form -->
    <div class="ml-auto flex items-center">
      @if (accountService.currentUser(); as user) {
        <div class="dropdown dropdown-end">
          <!-- ปรับปุ่มเป็นทรงแคปซูล (rounded-full) ที่โอบรับกับรูปวงกลมด้านซ้ายพอดี -->
          <div
            tabindex="0"
            role="button"
            class="flex cursor-pointer items-center gap-2.5 rounded-full border border-white/25 bg-white/10 py-1 pr-3.5 pl-1.5 text-white backdrop-blur-xs transition-all hover:border-white/40 hover:bg-white/20 active:scale-95"
          >
            <!-- รูป Avatar ขนาดพอดีกับกรอบแคปซูล ไม่ล้นขอบ -->
            <div class="avatar">
              <div class="size-8 rounded-full border-2 border-white/90 shadow-xs">
                <img src="/user.png" alt="user avatar" />
              </div>
            </div>

            <!-- ชื่อผู้ใช้ -->
            <span class="text-sm font-bold tracking-wide">{{ user.displayName }}</span>

            <!-- ไอคอนลูกศร -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="size-4 opacity-80"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
          </div>

          <!-- Dropdown Menu -->
          <ul
            tabindex="0"
            class="menu dropdown-content bg-base-100 text-base-content rounded-box z-50 mt-2.5 w-56 border border-gray-100 p-2 shadow-xl"
          >
            <li
              class="menu-title px-3 py-1.5 text-xs font-bold tracking-wider text-gray-400 uppercase"
            >
              My Account
            </li>
            <li>
              <a
                class="flex items-center gap-3 rounded-lg py-2.5 font-medium hover:bg-rose-50 hover:text-rose-600"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                  />
                </svg>
                Edit Profile
              </a>
            </li>
            <div class="divider my-0.5"></div>
            <li>
              <a
                (click)="logout()"
                class="flex items-center gap-3 rounded-lg py-2.5 font-medium text-error hover:bg-error/10"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="size-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"
                  />
                </svg>
                Logout
              </a>
            </li>
          </ul>
        </div>
      } @else {
        <!-- ฟอร์ม Login ใช้ DaisyUI input และ btn ผสมกับ Glassmorphism -->
        <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-2.5">
          <input
            [(ngModel)]="creds.email"
            name="email"
            type="text"
            class="input input-sm h-9 rounded-lg border-white/25 bg-white/15 text-white placeholder-white/60 backdrop-blur-xs transition-all focus:border-white focus:bg-white focus:text-gray-900 focus:placeholder-gray-400 focus:outline-hidden"
            placeholder="Email"
          />
          <input
            [(ngModel)]="creds.password"
            name="password"
            type="password"
            class="input input-sm h-9 rounded-lg border-white/25 bg-white/15 text-white placeholder-white/60 backdrop-blur-xs transition-all focus:border-white focus:bg-white focus:text-gray-900 focus:placeholder-gray-400 focus:outline-hidden"
            placeholder="Password"
          />
          <button
            type="submit"
            class="btn btn-sm h-9 rounded-lg border-none bg-white px-5 font-bold text-rose-600 shadow-md transition-all hover:bg-rose-50 hover:shadow-lg active:scale-95"
          >
            Login
          </button>
        </form>
      }
    </div>
  </div>
</header>
