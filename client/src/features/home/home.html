<div class="min-h-[calc(100vh-4rem)] bg-slate-50 flex items-center justify-center px-4 py-12">
  @if (!registerMode()) {
    <div class="max-w-lg text-center flex flex-col items-center">
      <!-- วงกลมไอคอนไล่สีชมพู-ม่วงอ่อนๆ -->
      <div class="p-6 bg-gradient-to-tr from-pink-100 to-purple-100 rounded-full mb-6 shadow-inner">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="size-24 text-pink-600"
        >
          <path
            d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"
          />
        </svg>
      </div>

      <!-- หัวข้อหลัก -->
      <h1 class="text-5xl font-extrabold tracking-tight text-slate-800">
        Find your
        <span class="bg-linear-to-r from-pink-600 to-purple-600 bg-clip-text text-transparent"
          >match</span
        >
      </h1>

      <p class="py-6 text-lg text-slate-500">Come on in... all you need to do is sign up!</p>

      <!-- ปุ่มกด -->
      <div class="flex items-center justify-center gap-4 mt-2">
        <button
          (click)="showRegister(true)"
          class="px-8 py-3.5 rounded-xl font-semibold text-white bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 shadow-md hover:shadow-lg transition-all cursor-pointer"
        >
          Register
        </button>
        <button
          class="px-8 py-3.5 rounded-xl font-semibold text-purple-600 bg-white border-2 border-purple-200 hover:border-purple-400 hover:bg-purple-50 transition-all cursor-pointer"
        >
          Learn more
        </button>
      </div>
    </div>
  } @else {
    <div class="w-full max-w-md mx-auto">
      <app-register class="block w-full" (cancelRegister)="showRegister($event)" />
    </div>
  }
</div>
