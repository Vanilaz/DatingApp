<app-nav />

<div
  [class.mt-24]="router.url !== '/'"
  [class.container]="router.url !== '/'"
  [class.mx-auto]="router.url !== '/'"
>
  <router-outlet />
</div>

<!-- DaisyUI Toast Container มุมขวาล่าง -->
<div class="toast toast-end toast-bottom z-50">
  @for (t of toastService.toasts(); track t.id) {
    <div
      class="alert shadow-lg text-white font-medium min-w-64 flex justify-between"
      [class.alert-success]="t.type === 'success'"
      [class.alert-error]="t.type === 'error'"
      [class.alert-info]="t.type === 'info'"
      [class.alert-warning]="t.type === 'warning'"
    >
      <span>{{ t.message }}</span>
      <button (click)="toastService.remove(t.id)" class="btn btn-ghost btn-xs">✕</button>
    </div>
  }
</div>
